<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omar Vásquez — Social card source</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:'Jost',sans-serif;color:#141821;background:radial-gradient(ellipse at 9% 8%,#B7D8EF,transparent 64%),radial-gradient(ellipse at 102% 85%,#F0BE9D,transparent 57%),#F2F4F7}
.frame{position:absolute;inset:22px;border:1px solid rgba(255,255,255,.72);border-radius:34px}
.top{position:absolute;top:48px;left:66px;right:60px;display:flex;align-items:center;justify-content:space-between}
.eyebrow{font-size:16px;letter-spacing:.19em;text-transform:uppercase;font-weight:600;color:#2B4D6A}
.top img{width:56px;height:56px;box-shadow:0 7px 24px -10px #1E4A6E44;border-radius:14px}
.name{position:absolute;left:53px;top:137px;margin:0;padding:0 26px 0 0;font-size:286px;line-height:.86;letter-spacing:-.055em;font-weight:900;white-space:nowrap;color:#182D40}
.surname{position:absolute;left:72px;top:314px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:174px;line-height:1;font-weight:500;letter-spacing:-.025em;color:#C4551A}
.note{position:absolute;right:64px;top:373px;width:436px;padding:25px 30px 28px;border-radius:28px;background:rgba(255,255,255,.64);border:1px solid rgba(255,255,255,.75);box-shadow:0 16px 40px -22px #1E4A6E55}
.note p{margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:52px;line-height:1.02;letter-spacing:-.015em}.note em{color:#AD430C}
.bottom{position:absolute;left:68px;right:66px;bottom:44px;display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:20px;color:#2C4F6B}
.bottom b{font-weight:600}.bottom span{font-size:17px;color:#495569}
</style>
</head>
<body>
<div class="frame"></div>
<div class="top"><div class="eyebrow">Omar Vásquez · Portfolio / CV</div><img src="../favicon.svg" alt="OV"></div>
<h1 class="name">OMAR</h1>
<div class="surname">Vásquez</div>
<div class="note"><p>Faccio funzionare<br><em>le cose.</em></p></div>
<div class="bottom"><b>Eventi · Produzione · Marketing</b><span>omar-vasquez.vercel.app</span></div>
</body>
</html>
